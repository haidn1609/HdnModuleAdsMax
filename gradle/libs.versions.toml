[versions]
agp = "8.12.3"
junit = "4.13.2"
appcompat = "1.7.1"
material = "1.14.0"
coreKtx = "1.18.0"
lifecycleProcess = "2.8.7"
applovinSdk = "13.7.0"
ump = "3.2.0"
shimmer = "0.5.0"
gson = "2.14.0"
constraintlayout = "2.2.1"
firebaseBom = "33.16.0"
googleServices = "4.4.2"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }
applovin-sdk = { group = "com.applovin", name = "applovin-sdk", version.ref = "applovinSdk" }
ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

[plugins]
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "2.2.0" }
